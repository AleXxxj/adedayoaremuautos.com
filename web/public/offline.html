<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070C0A">
<title>You're offline | Adedayo Aremu Autos</title>
<!--
  Shown by the service worker (sw.js) in place of a page that could not be
  reached. One file with everything inside it, because nothing else can be
  fetched while offline: no stylesheet, no font, no script file.

  It is the same for every visitor and holds no prices, cars or phone
  numbers, so it can never be out of date. The one personal touch, the count
  of saved cars, is read on the phone from the list the phone already keeps
  (localStorage, see components/cars/savedStore.ts). It is not sent anywhere,
  and it is only shown when the count is real.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 32px max(24px, env(safe-area-inset-left)) 32px max(24px, env(safe-area-inset-right));
    background: #070C0A;
    color: #F1F6F3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  img { width: 72px; height: 72px; margin-bottom: 10px; }
  .name { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #A9B8B0; }
  h1 { font-size: clamp(36px, 10vw, 56px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.04; }
  p { max-width: 30ch; font-size: 17px; line-height: 1.45; color: #C5D0CA; }
  button {
    min-height: 52px;
    min-width: 200px;
    margin-top: 14px;
    padding: 0 28px;
    border: 0;
    border-radius: 999px;
    background: #15964F;
    color: #070C0A;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #F1F6F3; outline-offset: 3px; }
  [hidden] { display: none; }
</style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="" width="72" height="72">
  <p class="name">ADEDAYO AREMU AUTOS</p>
  <h1>You're offline</h1>
  <p>Check your connection, then try again.</p>
  <p id="saved" hidden></p>
  <button type="button" id="retry">Try again</button>
  <script>
    // Asks for the same address again: the offline page is shown in place of
    // the page that failed, so a reload is a retry of that page.
    document.getElementById("retry").addEventListener("click", function () {
      location.reload();
    });
    // Back by itself when the connection returns.
    window.addEventListener("online", function () {
      location.reload();
    });
    try {
      var count = 0;
      ["us", "ng"].forEach(function (market) {
        var list = JSON.parse(localStorage.getItem("aaa:saved:" + market) || "[]");
        if (Array.isArray(list)) count += list.length;
      });
      if (count > 0) {
        var line = document.getElementById("saved");
        line.textContent =
          count === 1
            ? "Your saved car is kept on this device. It will be here when you are back online."
            : "Your " + count + " saved cars are kept on this device. They will be here when you are back online.";
        line.hidden = false;
      }
    } catch (e) {}
  </script>
</body>
</html>
